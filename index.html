<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="home-page">
        <header>
            <a href="#">Gmail</a>
            <a href="#">Image</a>
            <a onclick="showLoginPage()" class="signin-button">Sign In</a>
        </header>
        <main>
            <div class="google-logo">
                <span class="blue">G</span><span class="red">O</span><span class="red">O</span><span
                    class="green">G</span><span class="yellow">L</span><span class="Orange">E</span>
            </div>
            <div class="search-container">
                <input type="text" class="search-box" placeholder="Search Google or Type URL">
                <button class="ai-mode">
                    <i class="ai-mode">AI Mode</i>
                </button>
            </div>

        </main>

        <footer>
            India • Privacy • Terms • Settings
        </footer>
    </div>


    <div id="login-screen" class="login-overlay">
        <div class="login-page">
            <div class="google-small">
                <span class="blue">G</span><span class="red">O</span><span class="red">O</span><span
                    class="green">G</span><span class="yellow">L</span><span class="Orange">E</span>
            </div>
            <h2>Sign In </h2>
            <p>to Continou to Gmail</p>
            <form onsubmit="handleLogin(event)">
                <input type="email" placeholder="Phone or Email" class="input">
                <input type="password" placeholder="passward" class="input">

                <div class="login-back-next">
                    <span onclick="hideLoginPage()" class="back-link"> Back to Search </span>
                    <button class="next-button"> Next</button>
                </div>
            </form>
        </div>

    </div>

    <script>
          function showLoginPage() {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('home-page').style.display = 'none';
        }
function hideLoginPage() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('home-page').style.display = 'flex';
        }
      function handleLogin(event) {
       event.preventDefault();
       alert("लॉगिन सफल रहा!");
       hideLoginPage()
      }
        
    </script>
</body>

</html>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        font-family: Arial;
    }

    #home-page {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100vh;
    }

    header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 15px 20px;
    }

    header a {
        margin-left: 15px;
        color: black;
        cursor: pointer;
        font-size: 14px;
    }

    .signin-button {
        background-color: #1a73e8;
        padding: 8px 20px;
        color: white;
        font-weight: bold;
        border-radius: 4px;
    }

    .signin-button:hover {
        background-color: #1067d8;
    }

    main {
        display: flex;
        flex-direction: column;

        align-items: center;
        flex-grow: 1;
        justify-content: center;
    }

    .google-logo {
        font-size: 90px;
        font-weight: bold;
        margin-bottom: 25px;
    }

    .search-container {
        border: 1px solid #dfe1e5;
        display: flex;
        width: 650px;
        padding: 10px 12px;
        border-radius: 24px;
        justify-content: space-between;

    }

    .search-container:hover {
        box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
        border-color: rgba(223, 225, 229, 0);
    }

    .search-box {
        font-size: 14px;
        border: none;
        outline: none;
        width: 550px;
    }

    .ai-mode {
        background-color: rgb(232, 255, 255);
        border: none;
        border-radius: 10px;
        padding: 6px 8px;
        cursor: pointer;
    }

    footer {
        padding-bottom: 15px;
        border-top: 1px solid rgba(173, 170, 170, 0.767);
        text-align: center;
        font-size: 14px;
        color: #9a9faa;
        padding-top: 10px;
    }


    .login-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: white;
        justify-items: center;
display: none;
        align-items: center;
        z-index: 1000;
    }

    .login-page {

        justify-content: center;
        width: 380px;
        padding: 40px;
        text-align: center;
        border: 1px solid #dadce0;
        border-radius: 8px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    .login-page h2 {
        font-size: 24px;
        font-weight: 400;

    }

    .login-page p {
        font-size: 16px;
        font-weight: 50;
        margin-bottom: 30px;
    }

    .google-small {
        font-size: 30px;
    }

    .blue {
        color: #4285F4;
    }

    .red {
        color: #EA4335;
    }

    .yellow {
        color: #FBBC05;
    }

    .green {
        color: #34A853;
    }

    .input {
        width: 100%;
        margin-bottom: 10px;
        box-sizing: border-box;
        padding: 10px;
        border-radius: 4px;
        outline: none;
        border: 1px solid #dadce0;
    }

    .login-back-next {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        align-items: center; 
    }

    .back-link {
        font-size: 12px;
        color: #4285F4;
        font-weight: bold;
        cursor: pointer;


    }
.next-button{
    background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
}
    
</style>
